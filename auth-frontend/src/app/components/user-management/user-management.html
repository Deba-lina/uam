<div class="form-container">
    <div class="section-header">
        <h2>{{ editingUser ? 'Edit User' : 'Add User' }}</h2>
    </div>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="row">
            <div class="form-group">
                <label>First Name <span>*</span></label>
                <input type="text" formControlName="firstName">

                <small *ngIf="userForm.get('firstName')?.touched &&
                    userForm.get('firstName')?.invalid">
                    First Name is required
                </small>
            </div>

            <div class="form-group">
                <label>Last Name <span>*</span></label>
                <input type="text" formControlName="lastName">

                <small *ngIf="userForm.get('lastName')?.touched &&
                    userForm.get('lastName')?.invalid">
                    Last Name is required
                </small>
            </div>

        </div>

        <div class="row">
            <div class="form-group">
                <label>Email <span>*</span></label>
                <input type="email" formControlName="email">
                <small *ngIf="userForm.get('email')?.touched &&
                    userForm.get('email')?.invalid">
                    Enter a valid email
                </small>
            </div>

            <div class="form-group">
                <label>Password <span>*</span></label>
                <input type="password" formControlName="password">
                <small *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid">Password must be at least 6 characters</small>
            </div>

            <div class="form-group">
                <label>User Role <span>*</span></label>
                <select formControlName="role">
                    <option value="">
                        Select Role
                    </option>
                    <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group full-width">
                <label>Site <span>*</span></label>
                <select formControlName="site">
                    <option value="">
                        Select Site
                    </option>
                    <option *ngFor="let site of sites" [value]="site">

                        {{ site }}
                    </option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Team <span>*</span></label>
                <select formControlName="team">
                    <option value="">
                        Select Team
                    </option>
                    <option *ngFor="let team of teams" [value]="team">{{ team }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Team Role <span>*</span></label>
                <select formControlName="teamRole">
                    <option value="">
                        Select Team Role
                    </option>
                    <option *ngFor="let role of teamRoles" [value]="role">{{ role }}</option>
                </select>
            </div>
        </div>

        <div class="button-container">
            <button type="submit">
                {{ editingUser ? 'Update User' : 'Save User' }}
            </button>
        </div>

    </form>

</div>
